services:
  archivist:
    image: ghcr.io/nckslvrmn/archivist:${ARCHIVIST_VERSION:-latest}
    container_name: archivist
    restart: always
    ports:
    - "8080"
    environment:
    - TZ=America/New_York
    - PUID=911
    - PGID=911
    volumes:
    - /mnt/data/archivist:/data
    - /mnt/data:/data/sources
    labels:
    - "traefik.enable=true"
    - "traefik.http.routers.archivist.rule=Host(`archivist.slvr.io`)"
    - "traefik.http.routers.archivist.entrypoints=internal"
    networks:
    - traefik

networks:
  traefik:
    external: true
